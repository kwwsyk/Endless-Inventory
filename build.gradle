plugins {
//    // https://plugins.gradle.org/plugin/com.diffplug.gradle.spotless
//    id("com.diffplug.spotless") version("8.1.0")
//
//    // https://plugins.gradle.org/plugin/com.dorongold.task-tree
//    id("com.dorongold.task-tree") version("4.0.1")

    // https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml
    id("net.fabricmc.fabric-loom") version("${loom_version}") apply(false)

    // https://maven.fabricmc.net/net/fabricmc/fabric-loom-companion/net.fabricmc.fabric-loom-companion.gradle.plugin/maven-metadata.xml
    // applying this to all projects allows loom projects to access the required data in a manner that follows Gradle's best practices.
    id("net.fabricmc.fabric-loom-companion") version("${loom_version}")

    // https://projects.neoforged.net/neoforged/moddevgradle
    id("net.neoforged.moddev") version("2.0.148") apply(false)

    // https://plugins.gradle.org/plugin/me.modmuss50.mod-publish-plugin
    id("me.modmuss50.mod-publish-plugin") version("1.1.0") apply(false)
}

group = mod_group_id
version = mod_version

subprojects {
    repositories {
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = 'https://repo.spongepowered.org/repository/maven-public'
                }
            }
            filter { includeGroup('org.spongepowered') }
        }
        exclusiveContent {
            forRepositories(
                    maven {
                        name = 'ParchmentMC'
                        url = 'https://maven.parchmentmc.org/'
                    },
                    maven {
                        name = 'NeoForge'
                        url = 'https://maven.neoforged.net/releases'
                    }
            )
            filter { includeGroup('org.parchmentmc.data') }
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
        }
    }
}
