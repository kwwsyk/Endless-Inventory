# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G --add-opens=java.base/java.lang.ref=ALL-UNNAMED
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=12
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn


# Environment Properties
java_version = 25


#Minecraft
minecraft_version=26.1
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.11
parchment_version=2025.12.20
# https://projects.neoforged.net/neoforged/neoform
neoform_version=26.1-1
#or 1.21.11_unobfuscated-2

# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1,26.2)
fabric_minecraft_version_range=>=26.1 <26.2

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=endless_inventory
# The human-readable display name for the mod.
mod_name=Endless Inventory
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=1.1.4
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.kwwsyk
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Kay_Zhang
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=This mod provides an RPG like inventory space, allowing player to store endless items.\nAnd do something else.\nMod using namespace: endless_inventory, endinv
credits = 0

#curseforge
curseforge_project_id=1270888
modrinth_project_id=Nie8wO7y

#Neoforge
# https://neoforged.net/
neoforge_version = 26.1.0.19-beta
neo_version_range = [26.1,)

# Forge
# https://files.minecraftforge.net/net/minecraftforge/forge/index_1.21.1.html
forge_version= 62.0.9
forge_loader_version_range=[62,)

# Fabric Properties
# check these on https://modmuss50.me/fabric.html
yarn_mappings=1.21.11+build.4
loom_version=1.16-SNAPSHOT
# Fabric API
fabric_version=0.145.1+26.1
fabric_loader_version=0.19.2
fabric_loader_version_range = [0.19,)
# Mod Properties
maven_group = com.kwwsyk.endinv.fabric
archives_base_name = fabric


# Mod dependencies

# jei
# https://github.com/mezz/JustEnoughItems
# https://maven.blamejared.com/mezz/jei/
jei_version=29.2.0.21
# forge/neo/fabric have the same jei version number

# curios
#https://maven.theillusivec4.top/top/theillusivec4/curios
curio_version=15.0.0-beta.1+26.1
# forge_curio_version = NULL : no curios forge version above 1.21

# Cloth Config
# only forge,fabric use it. Neoforge has its config screen api
# https://linkie.shedaniel.dev/dependencies?loader=fabric&version=1.21.1
cloth_config_version=
# both forge and fabric
